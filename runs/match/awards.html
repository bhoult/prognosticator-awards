/* Layout: an awards almanac. A masthead, the grand award as a wide plate, then plates in a wrapping grid;
   every winning prediction is drawn as a span from the year it was written to the year it came true. */
:root {
  --paper: #e8ecee;       /* cool observatory-plate paper */
  --plate: #f6f8f8;
  --ink: #18203d;         /* deep indigo ink */
  --muted: #4f5874;
  --rule: #c3cad3;
  --gold: #9a6a12;        /* medal brass */

  --span: #c99a3c;
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1324; --plate: #161c33; --ink: #e5e8f1; --muted: #a3abc4; --rule: #2d3553;
  --gold: #e2b45a; --true: #5cc6b4; --span: #b88d3a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e1324; --plate: #161c33; --ink: #e5e8f1; --muted: #a3abc4; --rule: #2d3553;
  --gold: #e2b45a; --true: #5cc6b4; --span: #b88d3a; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--true); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mast { display: grid; gap: 10px; border-bottom: 3px double var(--ink); padding-bottom: 18px; }
.mast .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mast h1 { font: 900 clamp(48px, 10vw, 112px)/.86 var(--display); letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }

.formula p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 15px; }
h2.section { font: 800 30px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 46px 0 6px; display: flex; gap: 14px; align-items: baseline; }

.span .end { position: absolute; top: 0; width: 3px; height: 15px; background: var(--true); }
.span .start { position: absolute; top: 0; width: 2px; height: 15px; background: var(--ink); }
.ru { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; }
.ru li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px dotted var(--rule); padding-bottom: 2px; }

.wait div { border-top: 2px solid var(--ink); padding-top: 8px; display: grid; gap: 4px; min-width: 0; }
.wait .n { font: 800 34px/1 var(--display); color: var(--gold); }
.wait .idea { font: 600 16px/1.25 var(--body); }
.wait .src { font-size: 13px; color: var(--muted); }
.wait blockquote { margin: 0; font-style: italic; font-size: 14px; overflow-wrap: anywhere; }
.notes { margin-top: 46px; border-top: 3px double var(--ink); padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px 32px; font-size: 14px; color: var(--muted); }

.notes p { margin: 0 0 8px; }

@media (prefers-reduced-motion: no-preference) { .span .bar { transition: width .6s ease; } }
</style>

ally so they are cheap or indistinguishable from natural stones.", "quote": "Suppose one to have at last just hit the right trick, before the secret got out and diamonds became as common as coal, one might realise millions.", "title": "The Stolen Bacillus and Other Incidents", "year": 1895, "authors": ["H. G. Wells"], "came_true": "1957", "kind": "first_practical_use", "event": "General Electric's Detroit plant made man-made industrial diamonds in quantity (100,000 carats by Nov 1957) and began supplying them to industry for grinding wheels, lapping and dressing; by March 1958 GE offered them in unlimited quantities.", "confidence": "medium", "lead": 62, "score": 0.75, "points": 4.48, "demonstration_only": false}, {"concept": "United States as leading world power", "concept_id": "us-world-leadership", "definition": "The United States becomes the dominant world power and leading financial and trading nation, with decisive influence over peace settlements, finance, markets and culture.", "quote": "These things render the transfer of the present mercantile and naval ascendency of Great Britain to the United States during the next two or three decades a very probable thing", "title": "Anticipations", "year": 1901, "authors": ["H. G. Wells"], "came_true": "1945", "kind": "first_practical_use", "event": "With the end of World War II the United States stood as the dominant world power: leading creditor and financial power (Bretton Woods dollar system, 1944) and decisive voice in the peace settlements.", "confidence": "medium", "lead": 44, "score": 0.75, "points": 4.12, "demonstration_only": false}, {"concept": "Decline and disappearance of newspapers", "concept_id": "decline-of-newspapers", "definition": "Printed daily newspapers lose their place as the main source of news and shrink or vanish, replaced by broadcast, telephone or networked news delivery.", "quote": "the great Flying or Wind Vane or Water Companies, or to an appointment on one of the General Intelligence Organisations that had replaced newspapers", "title": "Tales of Space and Time", "year": 1899, "authors": ["H. G. Wells"], "came_true": "1963", "kind": "first_practical_use", "event": "Elmo Roper's 1963 national survey for the Television Information Office found more Americans naming television (55%) than newspapers (53%) as where they get most of their news.", "confidence": "medium", "lead": 64, "score": 0.625, "points": 3.76, "demonstration_only": false}], "why": "When the Sleeper Wakes (1899) wakes its sleeper into a London where the trade of the whole world runs on one currency of council cheques, which counts twice: one money across many states (the euro, 1999) and cash giving way to accounts (Sweden, 2015). Anticipations (1901) moves the world's mercantile lead to the United States (1945), and a story in The Stolen Bacillus (1895) imagines diamonds made so cheaply that they become \"as common as coal\" (General Electric, 1957). Edward Bellamy is a close second."}, {"id": "domain-society-politics", "title": "Society and politics", "rule": "The most points from ideas in society and politics.", "winner": {"name": "H. G. Wells", "key": "H. G. Wells", "points": 116.6, "stat": "116.6 points from 42 ideas"}, "runners_up": [{"name": "George Chetwynd Griffith", "key": "George Chetwynd Griffith", "points": 39.8, "stat": "39.8 points from 13 ideas"}, {"name": "Edward Bellamy", "key": "Edward Bellamy", "points": 39.2, "stat": "39.2 points from 13 ideas"}, {"name": "Ignatius Donnelly", "key": "Ignatius Donnelly", "points": 32.2, "stat": "32.2 points from 10 ideas"}, {"name": "Thomas More", "key": "Thomas More", "points": 28.8, "stat": "28.8 points from 7 ideas"}], "hits": [{"concept": "Rule by scientists or experts", "concept_id": "technocracy", "definition": "Government is run by scientists, engineers or trained experts rather than elected politicians.", "quote": "The suppression of the party machine in the purely democratic countries and of the official choice of the rich and privileged rulers in the more monarchical ones, by capable operative and administrative men inspired by the belief in a common theory of social order, will come about", "title": "Anticipations", "year": 1901, "authors": ["H. G. Wells"], "came_true": "1995-01", "kind": "first_practical_use", "event": "Italy: in January 1995 President Scalfaro appointed the central banker Lamberto Dini prime minister of a caretaker cabinet made up entirely of non-parliamentary technocrats, which governed until 1996.", "confidence": "medium", "lead": 94, "score": 0.75, "points": 4.93, "demonstration_only": false}, {"concept": "European political union", "concept_id": "european-political-union", "definition": "The nations of Europe unite under a common federal or confederal government or union with pooled sovereignty, shared institutions, free internal borders and often a single currency.", "quote": "The splendid dream of a Federal Europe, which opened the nineteenth century for France, may perhaps, after all, come to something like realization at the opening of the twenty-first.", "title": "Anticipations", "year": 1901, "authors": ["H. G. Wells"], "came_true": "1993-11-01", "kind": "first_practical_use", "event": "The Maastricht Treaty on European Union entered into force after ratification by all twelve member states, creating the European Union with common citizenship and institutions.", "confidence": "medium", "lead": 92, "score": 0.75, "points": 4.9, "demonstration_only": false}, {"concept": "State-enforced limits on births", "concept_id": "state-birth-limits", "definition": "A government caps family size or total population by law, licensing, incentive or sterilization.", "quote": "Utopia will control the increase of its population. Without the determination and ability to limit that increase as well as to stimulate it whenever it is necessary, no Utopia is possible.", "title": "A Modern Utopia", "year": 1905, "authors": ["H. G. Wells"], "came_true": "1972", "kind": "first_practical_use", "event": "Singapore's 'Stop at Two' policy: from 1972 (debated in Parliament 24 Oct 1972, building on 1968-69 measures) the state penalized third and later children through delivery fees, maternity leave, tax, housing and school priority, and paid sterilization incentives.", "confidence": "medium", "lead": 67, "score": 0.75, "points": 4.57, "demonstration_only": false}, {"concept": "Communal dining replaces home cooking", "concept_id": "communal-dining", "definition": "Households stop cooking at home and take meals from public dining halls, central kitchens or delivered prepared meals as the normal custom in a community or country.", "quote": "Instead there will be a great multitude of gracious little houses clustering in college-like groups, no doubt about their common kitchens and halls, down and about the valley slopes.", "title": "A Modern Utopia", "year": 1905, "authors": ["H. G. Wells"], "came_true": "1958", "kind": "first_practical_use", "event": "In China's 1958 people's communes, communal kitchens and mess halls replaced household cooking: by the end of 1958 more than 3.4 million kitchens fed about 90 percent of the rural population.", "confidence": "medium", "lead": 53, "score": 0.75, "points": 4.32, "demonstration_only": false}, {"concept": "English as the world language", "concept_id": "english-as-world-language", "definition": "English becomes the single dominant or near-universal language of commerce, science and diplomacy across most of the world, by custom or decree.", "quote": "Over a great part of the earth the English tongue was spoken; taken together with its Spanish American and Hindoo and Negro and “Pidgin” dialects, it was the everyday language of two-thirds of the people of the earth.", "title": "When the Sleeper Wakes", "year": 1899, "authors": ["H. G. Wells"], "came_true": "1950", "kind": "first_practical_use", "event": "By about 1950 English had replaced French and German as the leading international language of science and diplomacy, and of commerce under US leadership.", "confidence": "low", "lead": 51, "score": 0.75, "points": 4.28, "demonstration_only": false}], "why": "With tranche B the society and politics domain counts the social and political predictions themselves, and Wells leads it by almost three to one, 116.6 points to Griffith's 39.8. A Modern Utopia (1905) limits births and sends households to communal tables, When the Sleeper Wakes (1899) makes English the language of the world, and Anticipations (1901) unites Europe. His tranche-A hits are here too: machines that count votes and a central register of every citizen."}, {"id": "domain-other", "title": "Everything else", "rule": "The most points from ideas in everything else.", "winner": {"name": "H. G. Wells", "key": "H. G. Wells", "points": 47.3, "stat": "47.3 points from 18 ideas"}, "runners_up": [{"name": "Randall Garrett", "key": "Randall Garrett", "points": 38.6, "stat": "38.6 points from 14 ideas"}, {"name": "E. E. Smith", "key": "E. E. Smith", "points": 34.0, "stat": "34.0 points from 16 ideas"}, {"name": "George O. Smith", "key": "George O. Smith", "points": 31.6, "stat": "31.6 points from 12 ideas"}, {"name": "Edmond Hamilton", "key": "Edmond Hamilton", "points": 30.5, "stat": "30.5 points from 11 ideas"}], "hits": [{"concept": "Smart adaptive clothing", "concept_id": "smart-adaptive-clothing", "definition": "Garments sense or respond to the wearer or environment by heating, cooling, changing color, glowing, self-fitting or self-cleaning.", "quote": "a costume of elastic material with distensible warts and horns, changing in colour as he walked, by an ingenious arrangement of versatile chromatophores", "title": "Tales of Space and Time", "year": 1899, "authors": ["H. G. Wells"], "came_true": "1989", "kind": "first_practical_use", "event": "Spyder sold ski wear in a new fabric that changes color with temperature fluctuations and is washable.", "confidence": "low", "lead": 90, "score": 0.75, "points": 4.88, "demons stitutions that give those who choose it a painless death.", "quote": "Such as are wrought on by these persuasions either starve themselves of their own accord, or take opium, and by that means die without pain.", "title": "Utopia", "year": 1516, "authors": ["Thomas More"], "came_true": "1985", "kind": "first_practical_use", "event": "Exit Deutsche Schweiz, a Swiss right-to-die society founded in 1982, medically assisted its first patient to end his life.", "confidence": "low", "lead": 469, "score": 0.75, "points": 6.66, "demonstration_only": false}, {"concept": "Multistage rocket", "concept_id": "multistage-rocket", "definition": "A rocket made of stacked stages that fire in turn and are dropped as their fuel is used, to reach space or high altitude.", "quote": "For so soon as the Flame had devoured one tier of Squibs, which were ranked by six and six, by means of a Train that reached every half-dozen, another tier went off, and then another", "title": "A Voyage to the Moon", "year": 1657, "authors": ["Cyrano de Bergerac"], "came_true": "1944-11", "kind": "first_practical_use", "event": "About 20 Rheinbote four-stage rockets were fired from Zwolle in the Netherlands against Antwerp, starting in autumn 1944 (Wikipedia gives December 1944 to January 1945; a 1948 BIS article says November 1944).", "confidence": "medium", "lead": 287, "score": 0.75, "points": 6.13, "demonstration_only": false}, {"concept": "Hearing aid", "concept_id": "hearing-aid", "definition": "A device worn to amplify faint sounds or shift them into the audible range so a person can hear better.", "quote": "We have certain helps which set to the ear do further the hearing greatly.", "title": "New Atlantis", "year": 1627, "authors": ["Francis Bacon"], "came_true": "1900", "kind": "first_practical_use", "event": "The Akouphone Company of New York was selling the Akouphone, a portable electric instrument for the partially deaf, by December 1900 and exhibiting it to schools and otologists.", "confidenc const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yr = d => parseInt(String(d), 10) * (String(d).startsWith('-') ? 1 : 1);
const fmtYear = y => y < 0 ? `${-y} BCE` : y < 1000 ? `${y} CE` : `${y}`;
const fmtDate = d => { const s = String(d); const m = s.match(/^(-?\d+)(?:-(\d{2}))?(?:-(\d{2}))?$/); if (!m) return s;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return (m[3] ? `${+m[3]} ` : '') + (m[2] ? `${months[+m[2] - 1]} ` : '') + fmtYear(+m[1]); };
const AXIS = [1620, 2030];  // one time axis for every modern plate, so spans compare across the page

function span(h, axis) {
  const [lo, hi] = axis, a = yr(h.year), b = yr(h.came_true), pct = y => Math.max(0, Math.min(100, (y - lo) / (hi - lo) * 100));
  const s = $('div', 'span'); s.setAttribute('role', 'img');
  s.setAttribute('aria-label', `Written ${fmtYear(a)}, came true ${fmtYear(b)}: ${b - a} years`);
  s.innerHTML = `<span class="lab l">${fmtYear(a)}</span><div class="track"><div class="axis"></div>` +
    `<div class="bar" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%"></div>` +
    `<div class="start" style="left:${pct(a)}%"></div><div class="end" style="left:calc(${pct(b)}% - 3px)"></div></div>` +
    `<span class="lab r">${fmtYear(b)}</span>`;
  return s;
}

function hitEl(h, opts) {
  const li = $('li', 'hit');
  const flags = (h.demonstration_only ? '<span class="chip" title="Scored on a laboratory or trial demonstration">demo only</span>' : '') +
    (h.confidence === 'low' ? '<span class="chip" title="The date rests on a low-confidence milestone">low confidence</span>' : '');
  li.append($('div', 'idea', esc(h.concept) + flags));
  li.append($('blockquote', '', '“' + esc(h.quote) + '”'));
  const by = h.authors && h.authors.length ? ' — ' + esc(h.authors.join(' and ')) : '';
  li.append($('div', 'src', `<i>${esc(h.title)}</i>, ${fmtYear(h.year)}${opts.by ? by : ''}${h.stated_time ? ` · said: “${esc(h.stated_time)}”` : ''}`));
  const pts = opts.negative ? `judged ${h.score} the same thing` : `${h.lead} years early, judged ${h.score} → ${h.points} points`;
  li.append($('div', 'true', `<b>${opts.negative ? 'Happened' : 'Came true'} ${fmtDate(h.came_true)}:</b> ${esc(h.event)} <span class="stat">(${pts})</span>`));
  li.append(span(h, opts.axis || AXIS));
  return li;
}

function plate(a, opts = {}) {
  const p = $('article', 'plate' + (opts.grand ? ' grand' : '')); p.id = a.id;
  p.append($('div', 'cat', esc(opts.cat || 'Award')));
  p.append($('h3', '', esc(a.title)));
  const w = a.winner;
  p.append($('div', 'winner', esc(w.name)));
  p.append($('div', 'stat', esc((w.by ? `by ${w.by}${w.year ? ', ' + fmtYear(w.year) : ''} · ` : '') + w.stat)));
  if (a.why) p.append($('p', 'why', esc(a.why)));
  p.append($('p', 'rule', esc(a.rule)));
  const n = opts.grand ? 6 : (opts.hits ?? 2), ul = $('ul', 'hits');
  const axis = opts.axis || (a.hits.some(h => yr(h.year) < AXIS[0]) ? [Math.min(...a.hits.map(h => yr(h.year))) - 60, 2030] : AXIS);
  a.hits.slice(0, n).forEach(h => ul.append(hitEl(h, { ...opts, axis })));
  p.append(ul);
  if (a.runners_up && a.runners_up.length) {
    p.append($('div', 'ru-h', 'Runners-up'));
    const ru = $('ol', 'ru');
    a.runners_up.forEach(r => ru.append($('li', '', `<span>${esc(r.name)}${r.by ? ` <i>(${esc(r.by)})</i>` : ''}</span><span>${esc(r.stat)}</span>`)));
    p.append(ru);
  }
  return p;
}

function section(title, sub, items) {
  const m = document.getElementById('awards');
  m.append($('h2', 'section', esc(title) + (sub ? ` <small>${esc(sub)}</small>` : '')));
  const g = $('div', 'grid'); items.forEach(i => i && g.append(i)); m.append(g);
}

const A = Object.fromEntries(DATA.awards.map(a => [a.id, a]));
const pick = (prefix) => DATA.awards.filter(a => a.id.startsWith(prefix) && a.winner);
const n = x => x.toLocaleString('en-US');
document.getElementById('edition').textContent = `${DATA.edition} · scored ${DATA.scored}`;
document.getElementById('dek').textContent = DATA.dek;
const r = DATA.resolutions;
document.getElementById('facts').innerHTML = [
  [n(DATA.books), 'books and texts'], [n(DATA.claims), 'predictions read'], [n(r.realized || 0), 'came true'],
  [n(r.not_a_prediction || 0), 'already real when written'], [n(DATA.authors), 'authors and texts score'], [n(Math.round(DATA.points)), 'points in all']]
  .map(([v, l]) => `<span><b>${v}</b> ${l}</span>`).join('');
document.getElementById('method').textContent = DATA.method;

section('The top prize', '', [A.grand && plate(A.grand, { grand: true, cat: 'Grand award', by: true })]);
section('Single predictions', 'one passage each', ['prediction', 'long_view', 'on_time', 'last_words'].map(id => A[id] && A[id].winner &&
  plate(A[id], { cat: 'Prediction award', by: true, hits: 1, negative: id === 'last_words' })));
section('Bodies of work', 'authors and books', ['book', 'society', 'originator', 'precision', 'per_book'].map(id => A[id] && A[id].winner &&
  plate(A[id], { cat: 'Body of work', by: id === 'book' ? false : false })));
section('By era', 'when the book was first published', pick('era-').map(a => plate(a, { cat: 'Era award' })));
section('By field', 'what the idea is about', pick('domain-').map(a => plate(a, { cat: 'Field award' })));
section('By kind of text', 'beyond science fiction', pick('group-').map(a => plate(a, { cat: 'Text award',
  axis: a.id === 'group-ancient' ? [-200, 2030] : undefined })));
if (A.still_waiting) {
  const m = document.getElementById('awards');
  m.append($('h2', 'section', 'Still waiting <small>' + esc(A.still_waiting.rule) + '</small>'));
  if (A.still_waiting.why) m.append($('p', 'why wait-why', esc(A.still_waiting.why)));
  const w = $('div', 'wait');
  A.still_waiting.waiting.forEach(x => w.append($('div', '', `<span class="n">${n(x.books)}</span><span class="idea">${esc(x.concept)}</span>` +
    `<span class="src">books predict it; first: <i>${esc(x.first_title)}</i>, ${fmtYear(x.first_year)} — ${esc(x.first_by)}</span>` +
    `<blockquote>“${esc(x.quote)}”</blockquote>`)));
  m.append(w);
}
document.getElementById('notes').innerHTML = DATA.notes.map(([h, t]) => `<div><h4>${esc(h)}</h4>${t.map(p => `<p>${p}</p>`).join('')}</div>`).join('');
</script>
