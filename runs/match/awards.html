/* Layout: an awards almanac. A masthead, the grand award as a wide plate, then plates in a wrapping grid;
   every winning prediction is drawn as a span from the year it was written to the year it came true. */
:root {
  --paper: #e8ecee;       /* cool observatory-plate paper */

  --ink: #18203d;         /* deep indigo ink */
  --muted: #4f5874;
  --rule: #c3cad3;
  --gold: #9a6a12;        /* medal brass */

  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1324; --plate: #161c33; --ink: #e5e8f1; --muted: #a3abc4; --rule: #2d3553;
  --gold: #e2b45a; --true: #5cc6b4; --span: #b88d3a; color-scheme: dark } }
:root[data-theme="dark"] {

  --gold: #e2b45a; --true: #5cc6b4; --span: #b88d3a; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--true); }

.mast { display: grid; gap: 10px; border-bottom: 3px double var(--ink); padding-bottom: 18px; }
.mast .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mast h1 { font: 900 clamp(48px, 10vw, 112px)/.86 var(--display); letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }

.formula p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 15px; }
h2.section { font: 800 30px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 46px 0 6px; display: flex; gap: 14px; align-items: baseline; }
h2.section small { font: 400 14px/1.3 var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }

.span .end { position: absolute; top: 0; width: 3px; height: 15px; background: var(--true); }
.span .start { position: absolute; top: 0; width: 2px; height: 15px; background: var(--ink); }
.ru { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; }
.ru li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px dotted var(--rule); padding-bottom: 2px; }

.wait div { border-top: 2px solid var(--ink); padding-top: 8px; display: grid; gap: 4px; min-width: 0; }
.wait .n { font: 800 34px/1 var(--display); color: var(--gold); }
.wait .idea { font: 600 16px/1.25 var(--body); }
.wait .src { font-size: 13px; color: var(--muted); }
.wait blockquote { margin: 0; font-style: italic; font-size: 14px; overflow-wrap: anywhere; }
.notes { margin-top: 46px; border-top: 3px double var(--ink); padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px 32px; font-size: 14px; color: var(--muted); }

.notes p { margin: 0 0 8px; }
@media (max-width: 640px) { .formula { grid-template-columns: 1fr; } .plate.grand { padding: 20px 16px; } }
@media (prefers-reduced-motion: no-preference) { .span .bar { transition: width .6s ease; } }
</style>

": false}, {"concept": "Sleep and incapacitating gas", "concept_id": "incapacitating-gas", "definition": "A gas or aerosol that knocks out or paralyzes people en masse or individually, delivered by grenade, vent, spray or aircraft.", "quote": "by the whiff of a soporific which they diffused through the air, they steeped the systems of the sentinels in lethargy", "title": "Limanora", "year": 1903, "authors": ["Godfrey Sweven"], "came_true": "2002-10-26", "kind": "first_practical_use", "event": "Russian special forces pumped an aerosol anesthetic (believed to be a fentanyl-derivative mixture, 'Kolokol-1') into the ventilation of the Dubrovka theater in Moscow, knocking out the hostages and hostage takers before the storming; many hostages died.", "confidence": "high", "lead": 99, "score": 0.75, "points": 4.98, "demonstration_only": false}, {"concept": "Levitating furniture and objects", "concept_id": "levitating-furniture-objects", "definition": "Furniture and display objects held floating in the air without visible support by magnetic or unknown force.", "quote": "Up each side vibrated in the air tier upon tier of their automatic rests, enough to accommodate a nation.", "title": "Limanora", "year": 1903, "authors": ["Godfrey Sweven"], "came_true": "1989-01", "kind": "first_practical_use", "event": "The Levitating World Globe was on sale in 6-inch (about $100) and 9-inch (about $150) sizes.", "confidence": "medium", "lead": 86, "score": 0.75, "points": 4.83, "demonstration_only": false}, {"concept": "Electronic or digital wristwatch", "concept_id": "digital-wristwatch", "definition": "A watch worn on the wrist that keeps time by electronic or vibrating means and shows it on a lit or digital readout, often with extra features.", "quote": "Another and more convenient clock, or rather watch, consisted of an electric battery that kept a light irelium tongue vibrating; this latter controlled a graduated mechanism which pointed out on a face the exact lenta in the time of day that it was.", "title": "Limanora", "year": 1903, "authors": ["Godfrey Sweven"], "came_true": "1972-04-04", "kind": "first_practical_use", "event": "Hamilton Pulsar went on sale in an 18-carat gold case at $2,100 with a red LED display; commercial quantities followed from Christmas 1972.", "confidence": "medium", "lead": 69, "score": 0.75, "points": 4.6, "demonstration_only": false}], "why": "Godfrey Sweven was the pen name of John Macmillan Brown, a Scottish-born professor in New Zealand. Limanora, the Island of Progress (1903) tours a utopia run on applied science, and it scores on 81 ideas, the most of any single work: a tidal power station (the Rance, 1966), liquid air stored as grid energy (a plant near Manchester, 2018), a gas that puts crowds to sleep, implants that sharpen the senses, and screening of the whole population for disease."}, {"id": "prediction", "title": "Prediction of the Age", "rule": "The single prediction worth the most points, the closest match with the longest lead, in a work published since 1500.", "winner": {"name": "Richard Adams Locke", "points": 6.32, "stat": "Meteorites that came from the Moon, 148 years early"}, "runners_up": [{"name": "Cyrano de Bergerac", "points": 6.13, "stat": "Multistage rocket, 287 years early"}, {"name": "Voltaire", "points": 6.11, "stat": "Phobos and Deimos, the two moons of Mars, 125 years early"}, {"name": "Francis Bacon", "points": 6.07, "stat": "Hearing aid, 273 years early"}, {"name": "Luis Senarens", "points": 5.98, "stat": "Submarine air supply, 62 years early"}], "hits": [{"concept": "Meteorites that came from the Moon", "concept_id": "lunar-meteorites", "definition": "Rocks blasted off the lunar surface by volcanism or impacts later fall to Earth as meteorites.", "quote": "If we had before retained any doubt of the power of lunar volcanoes to throw fragments of their craters so far beyond the moon's attraction that they would necessarily gravitate to this earth", "title": "The Moon Hoax", "year": eads a person's specific thoughts, memories or images directly from their brain.", "quote": "I read from the marks made upon minds by a crime, not from scrawls and thumbprints upon paper. And my means of reading those marks are fortunately in my possession this morning.", "title": "The Achievements of Luther Trant", "year": 1910, "authors": ["Edwin Balmer", "William MacHarg"], "came_true": "2006", "kind": "first_demonstration", "event": "Thirion et al. (NeuroSpin, France) decoded fMRI activity to reconstruct and identify the visual pattern subjects viewed and the pattern they imagined (one of six self-chosen patterns), NeuroImage 33(4), accepted June 2006, online October 2006.", "confidence": "medium", "lead": 96, "score": 0.5, "points": 3.3, "demonstration_only": true}, {"concept": "Psychological methods in crime detection", "concept_id": "forensic-psychological-crime-detection", "definition": "Scientific psychological examination of suspects, mind traces or behavior to determine guilt or identify the culprit instead of physical evidence.", "quote": "I could tell within the hour if I could take you successively to the psychological laboratory and submit you to a test.", "title": "The Achievements of Luther Trant", "year": 1910, "authors": ["Edwin Balmer", "William MacHarg"], "came_true": "1921-04-19", "kind": "first_practical_use", "event": "John A. Larson's polygraph (blood pressure and breathing) was used by the Berkeley Police Department, under chief August Vollmer, to question the 90 residents of a UC Berkeley dormitory after thefts.", "confidence": "low", "lead": 11, "score": 0.625, "points": 2.24, "demonstration_only": false}, {"concept": "Traumatic amnesia and its cure", "concept_id": "traumatic-amnesia-and-recovery", "definition": "A person loses memory through shock or trauma and regains it by second shock, therapy, drug or recall of the original circumstances.", "quote": "an emotion so intense as that she suffered divides itself off from the rest of her c ion": "Regularly scheduled passenger and cargo spaceship service between planets and moons of the solar system.", "books": 366, "claims": 507, "first_title": "All Around the Moon", "first_by": "Jules Verne", "first_year": 1870, "quote": "Will any Air Line of space navigation ever undertake to start a system of locomotion between the different members of the solar system?"}, {"concept": "Faster-than-light travel", "definition": "A spacecraft travels between stars faster than the speed of light by some unspecified or generic drive.", "books": 349, "claims": 808, "first_title": "Lumen", "first_by": "Camille Flammarion", "first_year": 1873, "quote": "You start to-day for a star, and you arrive yesterday! What do I say—yesterday? You will arrive there seventy-two years ago, even a hundred years ago! The farther you go, the sooner you will arrive!"}, {"concept": "Telepathic mind reading", "definition": "Perceiving what another person is thinking, feeling or remembering directly by mental power, with or without their consent.", "books": 311, "claims": 582, "first_title": "Voyages to the Moon and the Sun", "first_by": "Cyrano de Bergerac", "first_year": 1662, "quote": "I arrange all the parts of my body in an order similar to yours; for, by arranging all parts of me like you, I excite in myself by this disposal of my matter the same thought that is produced in you"}], "winner": {"name": "Telepathic communication", "points": 0, "stat": "predicted in 473 books, first in The Mahabharata, Volume 3 (Books 8-12)"}, "why": "Telepathy is the future the corpus expects most and has not received: 473 books, from the Mahabharata to the pulps, imagine one mind speaking to another without a word, and nothing that fits has happened. Close behind come hand-held energy weapons (420 books), life and intelligence on other worlds, ships to the stars, regular passenger lines between the planets, and travel faster than light."}], "edition": "First awards, 2026 · technology and science", "scored": "2026-11-19", "dek": "For the science fiction, forecasts and old texts that saw the future first. Every prediction was read from the book itself, matched to the dated event that made it come true, and scored by how close it came and how far ahead it was written.", "method": "Closeness is the mean of two independent judges' scores on a five-step scale from 0 to 1 (a third judge where they differ by two steps). Years early run from first publication to the first practical use (or, where there is none yet, the first demonstration), capped at 500. An idea counts once per book and once per author, from their best book.", "notes": [["How it was made", ["3,224 books and texts: Project Gutenberg's science fiction with a known year, and 47 forecasts, utopias, prophecies and sacred texts. Sonnet subagents read every page and listed 77,436 technology and science predictions, each with a verbatim quote that code checked against the book.", "The predictions were matched to 1,756 ideas, and each idea that came true was dated from public sources by researchers who never saw the books, the claims or the authors. The 650 ideas that decide the rankings were researched a second time. Judges saw the passage and the event, never the author or the title."]], ["What to keep in mind", ["Ideas dated only by a demonstration are marked <i>demo only<\/i>; dates from a single, weak source are marked <i>low confidence<\/i>. 16,411 passages described things that already existed when they were written and score nothing.", "Ancient texts are dated by the end of the scholarly range for their composition, from each text's English Wikipedia article, and read in one translation each; the plan's second-translation check is not built yet.", "Social, political and historical predictions (tranche B, 46,211 more claims) are scored separately and are not in these awards yet."]], ["The data", ["Code, prompts, every milestone with its sources, the review decisions and the full reports are in the public repos const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yr = d => parseInt(String(d), 10) * (String(d).startsWith('-') ? 1 : 1);
const fmtYear = y => y < 0 ? `${-y} BCE` : y < 1000 ? `${y} CE` : `${y}`;
const fmtDate = d => { const s = String(d); const m = s.match(/^(-?\d+)(?:-(\d{2}))?(?:-(\d{2}))?$/); if (!m) return s;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return (m[3] ? `${+m[3]} ` : '') + (m[2] ? `${months[+m[2] - 1]} ` : '') + fmtYear(+m[1]); };
const AXIS = [1620, 2030];  // one time axis for every modern plate, so spans compare across the page

function span(h, axis) {
  const [lo, hi] = axis, a = yr(h.year), b = yr(h.came_true), pct = y => Math.max(0, Math.min(100, (y - lo) / (hi - lo) * 100));
  const s = $('div', 'span'); s.setAttribute('role', 'img');
  s.setAttribute('aria-label', `Written ${fmtYear(a)}, came true ${fmtYear(b)}: ${b - a} years`);
  s.innerHTML = `<span class="lab l">${fmtYear(a)}</span><div class="track"><div class="axis"></div>` +
    `<div class="bar" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%"></div>` +
    `<div class="start" style="left:${pct(a)}%"></div><div class="end" style="left:calc(${pct(b)}% - 3px)"></div></div>` +
    `<span class="lab r">${fmtYear(b)}</span>`;
  return s;
}

function hitEl(h, opts) {
  const li = $('li', 'hit');
  const flags = (h.demonstration_only ? '<span class="chip" title="Scored on a laboratory or trial demonstration">demo only</span>' : '') +
    (h.confidence === 'low' ? '<span class="chip" title="The date rests on a low-confidence milestone">low confidence</span>' : '');
  li.append($('div', 'idea', esc(h.concept) + flags));
  li.append($('blockquote', '', '“' + esc(h.quote) + '”'));
  const by = h.authors && h.authors.length ? ' — ' + esc(h.authors.join(' and ')) : '';
  li.append($('div', 'src', `<i>${esc(h.title)}</i>, ${fmtYear(h.year)}${opts.by ? by : ''}${h.stated_time ? ` · said: “${esc(h.stated_time)}”` : ''}`));
  const pts = opts.negative ? `judged ${h.score} the same thing` : `${h.lead} years early, judged ${h.score} → ${h.points} points`;
  li.append($('div', 'true', `<b>${opts.negative ? 'Happened' : 'Came true'} ${fmtDate(h.came_true)}:</b> ${esc(h.event)} <span class="stat">(${pts})</span>`));
  li.append(span(h, opts.axis || AXIS));
  return li;
}

function plate(a, opts = {}) {
  const p = $('article', 'plate' + (opts.grand ? ' grand' : '')); p.id = a.id;
  p.append($('div', 'cat', esc(opts.cat || 'Award')));
  p.append($('h3', '', esc(a.title)));
  const w = a.winner;
  p.append($('div', 'winner', esc(w.name)));
  p.append($('div', 'stat', esc((w.by ? `by ${w.by}${w.year ? ', ' + fmtYear(w.year) : ''} · ` : '') + w.stat)));
  if (a.why) p.append($('p', 'why', esc(a.why)));
  p.append($('p', 'rule', esc(a.rule)));
  const n = opts.grand ? 6 : (opts.hits ?? 2), ul = $('ul', 'hits');
  const axis = opts.axis || (a.hits.some(h => yr(h.year) < AXIS[0]) ? [Math.min(...a.hits.map(h => yr(h.year))) - 60, 2030] : AXIS);
  a.hits.slice(0, n).forEach(h => ul.append(hitEl(h, { ...opts, axis })));
  p.append(ul);
  if (a.runners_up && a.runners_up.length) {
    p.append($('div', 'ru-h', 'Runners-up'));
    const ru = $('ol', 'ru');
    a.runners_up.forEach(r => ru.append($('li', '', `<span>${esc(r.name)}${r.by ? ` <i>(${esc(r.by)})</i>` : ''}</span><span>${esc(r.stat)}</span>`)));
    p.append(ru);
  }
  return p;
}

function section(title, sub, items) {
  const m = document.getElementById('awards');
  m.append($('h2', 'section', esc(title) + (sub ? ` <small>${esc(sub)}</small>` : '')));
  const g = $('div', 'grid'); items.forEach(i => i && g.append(i)); m.append(g);
}

const A = Object.fromEntries(DATA.awards.map(a => [a.id, a]));
const pick = (prefix) => DATA.awards.filter(a => a.id.startsWith(prefix) && a.winner);
const n = x => x.toLocaleString('en-US');
document.getElementById('edition').textContent = `${DATA.edition} · scored ${DATA.scored}`;
document.getElementById('dek').textContent = DATA.dek;
const r = DATA.resolutions;
document.getElementById('facts').innerHTML = [
  [n(DATA.books), 'books and texts'], [n(DATA.claims), 'predictions read'], [n(r.realized || 0), 'came true'],
  [n(r.not_a_prediction || 0), 'already real when written'], [n(DATA.authors), 'authors and texts score'], [n(Math.round(DATA.points)), 'points in all']]
  .map(([v, l]) => `<span><b>${v}</b> ${l}</span>`).join('');
document.getElementById('method').textContent = DATA.method;

section('The top prize', '', [A.grand && plate(A.grand, { grand: true, cat: 'Grand award', by: true })]);
section('Single predictions', 'one passage each', ['prediction', 'long_view', 'on_time', 'last_words'].map(id => A[id] && A[id].winner &&
  plate(A[id], { cat: 'Prediction award', by: true, hits: 1, negative: id === 'last_words' })));
section('Bodies of work', 'authors and books', ['book', 'originator', 'precision', 'per_book'].map(id => A[id] && A[id].winner &&
  plate(A[id], { cat: 'Body of work', by: id === 'book' ? false : false })));
section('By era', 'when the book was first published', pick('era-').map(a => plate(a, { cat: 'Era award' })));
section('By field', 'what the idea is about', pick('domain-').map(a => plate(a, { cat: 'Field award' })));
section('By kind of text', 'beyond science fiction', pick('group-').map(a => plate(a, { cat: 'Text award',
  axis: a.id === 'group-ancient' ? [-200, 2030] : undefined })));
if (A.still_waiting) {
  const m = document.getElementById('awards');
  m.append($('h2', 'section', 'Still waiting <small>' + esc(A.still_waiting.rule) + '</small>'));
  if (A.still_waiting.why) m.append($('p', 'why wait-why', esc(A.still_waiting.why)));
  const w = $('div', 'wait');
  A.still_waiting.waiting.forEach(x => w.append($('div', '', `<span class="n">${n(x.books)}</span><span class="idea">${esc(x.concept)}</span>` +
    `<span class="src">books predict it; first: <i>${esc(x.first_title)}</i>, ${fmtYear(x.first_year)} — ${esc(x.first_by)}</span>` +
    `<blockquote>“${esc(x.quote)}”</blockquote>`)));
  m.append(w);
}
document.getElementById('notes').innerHTML = DATA.notes.map(([h, t]) => `<div><h4>${esc(h)}</h4>${t.map(p => `<p>${p}</p>`).join('')}</div>`).join('');
</script>
